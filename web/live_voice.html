<!DOCTYPE html>
<html>
<head>
  <title>Live Voice Listener</title>
  <meta charset="utf-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Sora', sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #05050b 100%);
      color: #f0f0ff;
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .header {
      padding: 16px 20px; background: rgba(15,15,28,0.9);
      border-bottom: 1px solid #2a2a40; backdrop-filter: blur(12px);
    }
    .title { font-size: 18px; font-weight: 700; color: #9d64ff; letter-spacing: 0.02em; }
    .status {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      background: rgba(12,17,34,0.8); border-bottom: 1px solid #2a2a40;
    }
    .mic-icon { font-size: 20px; }
    .status-listening .mic-icon { color: #ff6b6b; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
    .status-text { font-size: 14px; font-weight: 500; }
    .content { flex: 1; padding: 24px 20px; overflow-y: auto; }
    .transcript {
      background: rgba(20,20,36,0.6); border: 1px solid #3a3a50; border-radius: 12px;
      padding: 20px; min-height: 80px; margin-bottom: 20px; font-family: monospace;
      font-size: 15px; line-height: 1.5; white-space: pre-wrap; max-height: 200px;
      overflow-y: auto;
    }
    .mood-display {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-top: 16px;
    }
    .mood-card {
      background: linear-gradient(135deg, rgba(157,100,255,0.15), rgba(110,227,255,0.1));
      border: 1px solid rgba(157,100,255,0.3); border-radius: 12px; padding: 16px;
      text-align: center; backdrop-filter: blur(10px);
    }
    .mood-label { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .mood-score { font-size: 32px; font-weight: 800; color: #9d64ff; }
    .confidence { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .controls {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px;
    }
    .btn {
      padding: 12px 24px; border: none; border-radius: 12px; font-weight: 700;
      cursor: pointer; font-size: 14px; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn-primary { background: linear-gradient(90deg, #9d64ff, #6ee3ff); color: #0a0a14; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(157,100,255,0.4); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: #f0f0ff; border: 1px solid #4a4a60; }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .error { color: #ff6b6b; padding: 12px; background: rgba(255,107,107,0.1); border-left: 4px solid #ff6b6b; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Live Voice Assistant</div>
  </div>
  <div class="status" id="status">
    <span class="mic-icon" id="micIcon">🎤</span>
    <span class="status-text" id="statusText">Click microphone to speak</span>
  </div>
  <div class="content">
    <div class="transcript" id="transcript">Ready for voice commands like "play Inception" or "recommend happy movies"...</div>
    <div id="moodSection" style="display: none;">
      <div class="mood-display" id="mood-display">
        <div class="mood-card">
          <div class="mood-label" id="mood-label">CALM</div>
          <div class="mood-score" id="mood-score">92%</div>
          <div class="confidence" id="confidence">Voice Analysis</div>
        </div>
      </div>
    </div>
    <div id="error" class="error" style="display:none;"></div>
  </div>

  <script>
    class VoiceAssistant {
      constructor() {
        this.recognition = null;
        this.isListening = false;
        this.transcriptHistory = [];
        
        this.initElements();
        this.initSpeech();
      }
      
      initElements() {
        this.elements = {
          status: document.getElementById('status'),
          statusText: document.getElementById('statusText'),
          micIcon: document.getElementById('micIcon'),
          transcript: document.getElementById('transcript'),
          moodLabel: document.getElementById('mood-label'),
          moodScore: document.getElementById('mood-score'),
          moodSection: document.getElementById('moodSection'),
          error: document.getElementById('error')
        };
      }
      
      initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          this.showError('Speech recognition not supported in this browser.');
          return;
        }
        
        this.recognition = new SpeechRecognition();
        this.recognition.continuous = true;
        this.recognition.interimResults = true;
        this.recognition.lang = 'en-US';
        
        this.recognition.onstart = () => {
          this.isListening = true;
          this.updateStatus('Listening...', true);
          this.elements.micIcon.textContent = '🔴';
        };
        
        this.recognition.onresult = (event) => {
          let finalTranscript = '';
          let interimTranscript = '';
          
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += transcript + ' ';
            } else {
              interimTranscript += transcript;
            }
          }
          
          if (finalTranscript) {
            this.handleCommand(finalTranscript.trim());
          }
          
          if (interimTranscript) {
            this.updateTranscript('[live] ' + interimTranscript);
          }
        };
        
        this.recognition.onend = () => {
          this.isListening = false;
          this.updateStatus('Click microphone to speak', false);
          this.elements.micIcon.textContent = '🎤';
          // Auto-restart for continuous
          if (this.autoListen) {
            setTimeout(() => this.toggleListen(), 500);
          }
        };
        
        this.recognition.onerror = (event) => {
          console.error('Speech error:', event.error);
          this.updateStatus('Error: ' + event.error, false);
          this.elements.micIcon.textContent = '⚠️';
        };
      }
      
      toggleListen() {
        if (this.isListening) {
          this.recognition.stop();
        } else {
          this.autoListen = true;
          this.recognition.start();
        }
      }
      
      handleCommand(text) {
        this.transcriptHistory.unshift(text);
        this.transcriptHistory = this.transcriptHistory.slice(0, 5);
        
        this.updateTranscript(text);
        this.postMessage({
          type: 'transcript',
          text: text,
          timestamp: Date.now()
        });
        
        // Simple mood proxy from keywords (until backend ready)
        const mood = this.analyzeMoodFromText(text);
        this.updateMood(mood);
      }
      
      analyzeMoodFromText(text) {
        text = text.toLowerCase();
        if (text.includes('happy') || text.includes('excited') || text.includes('great')) return 'happy';
        if (text.includes('sad') || text.includes('down') || text.includes('boring')) return 'sad';
        if (text.includes('angry') || text.includes('mad') || text.includes('hate')) return 'angry';
        if (text.includes('anxious') || text.includes('scared') || text.includes('fear')) return 'anxious';
        if (text.includes('play') || text.includes('watch') || text.includes('recommend')) return 'excited';
        return 'calm';
      }
      
      updateTranscript(text) {
        this.elements.transcript.textContent = this.transcriptHistory.join('\\n\\n');
        this.elements.transcript.scrollTop = this.elements.transcript.scrollHeight;
      }
      
      updateMood(mood) {
        this.elements.moodLabel.textContent = mood.toUpperCase();
        this.elements.moodScore.textContent = Math.round(Math.random() * 20 + 80) + '%';  // Mock confidence
        this.elements.moodSection.style.display = 'block';
        
        this.postMessage({
          type: 'mood',
          mood: mood,
          confidence: 0.85 + Math.random() * 0.15
        });
      }
      
      updateStatus(text, listening) {
        this.elements.statusText.textContent = text;
        this.elements.status.classList.toggle('status-listening', listening);
      }
      
      showError(msg) {
        this.elements.error.textContent = msg;
        this.elements.error.style.display = 'block';
        setTimeout(() => {
          this.elements.error.style.display = 'none';
        }, 4000);
      }
      
      postMessage(data) {
        if (window.parent) {
          window.parent.postMessage({ source: 'liveVoice', data }, '*');
        }
      }
    }
    
    let voiceAssistant;
    
    window.addEventListener('load', () => {
      voiceAssistant = new VoiceAssistant();
      
      // Toggle on click anywhere
      document.addEventListener('click', (e) => {
        if (!voiceAssistant.isListening) {
          voiceAssistant.toggleListen();
        }
      });
      
      // Resize for Streamlit
      setTimeout(() => {
        window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: 420 }, '*');
      }, 100);
    });
  </script>
</body>
</html>
