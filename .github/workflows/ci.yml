# CI: on every push to develop/main and every PR into main, GitHub starts a
# fresh Linux machine, installs the project from scratch, and runs the linter
# and the test suite. A red cross on the PR means one of those steps failed.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # the job only reads the code

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # let both versions finish so you see every failure
      matrix:
        python-version: ["3.11", "3.12"] # the versions the README promises

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip # reuse downloaded packages between runs
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers pulls in PyTorch; the CPU build is ~10x
          # smaller than the default CUDA one and is all the tests need
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes src web tests

      - name: Test (pytest)
        # the Playwright UI test needs a running app and a browser; it skips
        # itself unless RUN_UI_TESTS=1
        run: python -m pytest -q --ignore=tests/playwright_ui_test.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out the code with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the latest

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # refuse to run a download whose checksum doesn't match the release
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Scan for secrets
        # known old findings are listed in .gitleaksignore; anything new fails
        # the job. --redact keeps the secret itself out of the public log.
        run: ./gitleaks git --no-banner --redact --verbose .
