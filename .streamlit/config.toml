[client]
# Hide the Deploy button and developer options from the top-right menu
toolbarMode = "minimal"

[theme]
# Matches the CSS tokens in web/app_streamlit.py (soot ground, lime accent)
base = "dark"
primaryColor = "#dafa9c"
backgroundColor = "#0f0f0f"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#ffffff"
baseRadius = "full"
