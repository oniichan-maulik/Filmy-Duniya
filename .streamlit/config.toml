[client]
# Hide the Deploy button and developer options from the top-right menu
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
# Palette "plum-black-pink" (taste-skill); keep in sync with the CSS tokens in web/app_streamlit.py
base = "dark"
primaryColor = "#ff488b"
backgroundColor = "#0d060b"
secondaryBackgroundColor = "#1b0e17"
textColor = "#ffffff"

[browser]
# Don't send usage stats to Streamlit (data.streamlit.io / fivetran)
gatherUsageStats = false
